server:
  port: 9107

spring:
  flyway:
    enabled: true
    # Pre-Flyway databases already have these tables (they were created by
    # ddl-auto). Baselining marks them at the baseline version and skips V1
    # instead of replaying it and failing on "relation already exists".
    baseline-on-migrate: true
  application:
    name: aegis-admin-api-service
  kafka:
    # The audit sink consumes the platform-wide event stream. Off unless a broker is configured, so
    # local unit tests boot with no Kafka; compose/prod set SPRING_KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      # Start from the beginning so a freshly-provisioned sink captures existing history, not just
      # events after it came up.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Don't start the @KafkaListener container unless a broker is actually configured, so the
      # service runs standalone (and unit tests pass) without Kafka.
      auto-startup: ${AEGIS_AUDIT_CONSUMER_ENABLED:false}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_admin}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:dev-only-change-me}
  jpa:
    hibernate:
      # Ship a safe default (validate): production runs versioned migrations (Flyway) and must never let
      # Hibernate mutate the schema. Local dev can set SPRING_JPA_DDL_AUTO=update; tests override to
      # create-drop (src/test/resources/application.yml).
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    open-in-view: false

aegis:
  security:
    # Set true (prod/stage do this via SPRING_PROFILES_ACTIVE) to force real external secrets/keys.
    require-external-secrets: ${AEGIS_REQUIRE_EXTERNAL_SECRETS:false}
  admin:
    tenant-admin-super-admin-fallback:
      # M-svc-3: implicit tenant:admin -> SUPER_ADMIN is OFF by default (it nullifies least-privilege
      # RBAC). Opt in explicitly for backward-compat; every implicit grant is then audit-logged.
      enabled: ${AEGIS_TENANT_ADMIN_SUPER_ADMIN_FALLBACK:false}
  jwt:
    # Keys fetched in-network; issuers validated against an allowlist (Docker split-horizon — see
    # ResourceServerJwtConfig). In Docker, AEGIS_JWKS_URI = http://authorization-server:9000/oauth2/jwks.
    jwk-set-uri: ${AEGIS_JWKS_URI:http://localhost:9000/oauth2/jwks}
    accepted-issuers: ${AEGIS_ACCEPTED_ISSUERS:http://localhost:9000,http://authorization-server:9000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
